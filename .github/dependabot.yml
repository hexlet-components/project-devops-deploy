version: 2
updates:
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-npm-major:
        patterns: ["*"]
        update-types: ["major"]
    # react-admin задаёт MUI и React в зависимостях и peerDependencies. Мажор,
    # который react-admin ещё не поддерживает, npm ставит второй копией рядом
    # со старой, и админка падает при запуске. Мажоры этих пакетов поднимаются
    # руками вместе с react-admin.
    ignore:
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-gradle-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
